<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Иконка Aura: звуковая волна внутри «ауры»-кольца. PNG/ICO рядом сгенерированы из этого макета. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#341e78"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff78c8"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#8c64ff" stroke-opacity="0.8" stroke-width="70" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="46"/>
  <g fill="#f6f1ff">
    <rect x="353" y="437" width="58" height="150" rx="29"/>
    <rect x="440" y="362" width="58" height="300" rx="29"/>
    <rect x="526" y="322" width="58" height="380" rx="29"/>
    <rect x="613" y="407" width="58" height="210" rx="29"/>
  </g>
</svg>
